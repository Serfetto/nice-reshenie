# Источники данных: адреса, расписание опроса, допустимая давность, политика для replay.
# interval_s  — как часто опрашивать в режиме «сейчас»
# max_age_s   — старше этого данные считаются устаревшими (-> «нет данных» в расчёте)
# replay      — exact: время выпуска известно; reconstructed: восстанавливается, в replay используется с пометкой
# issue_times_utc — плановое время выпуска (для подсказки «когда пересчитать»)
# group, provider, what, used_for — описание для раздела «Источники» консоли (radiation | orbit | mmod)
#
# При старте ingest догружает архив за период archive (дни без данных) и пропуск за время простоя
# (services/ingest/bootstrap.py). Дни, которых нет у поставщика, повторно запрашиваются не чаще recheck_days.
ingest:
  pause_max_min: 120   # «заморозка» источника из консоли общая для всех — снимается сама через 2 ч

archive:
  ranges:
    - ["2024-04-27", "2024-07-02"]   # проверочный период 01.05–30.06.2024 с запасом на контекст до и окно после
    # отложенные события для эксперимента (не использовались при подборе параметров, docs/experiments.md):
    - ["2024-02-08", "2024-02-24"]   # протонное событие S2 09–11.02 и спокойный период 19–23.02
    - ["2024-03-22", "2024-03-27"]   # протонное событие S2 (956 pfu) 23–25.03
    - ["2024-10-08", "2024-10-13"]   # протонное событие S3 09–11.10 и буря G4 10.10
  recheck_days: 7

swpc_alerts:
  title: "Алерты, предупреждения и сводки SWPC"
  group: radiation
  provider: "NOAA SWPC"
  what: "Официальные сообщения о начале и конце солнечных событий: алерты, предупреждения, сводки (протоны, магнитные бури, вспышки)."
  used_for: "Внешний прогноз и факт событий для частиц от Солнца; стоп-фактор S3 по сообщению SWPC."
  interval_s: 180
  max_age_s: 3600
  event_driven: true      # сообщения выходят по событию: свежесть = давность успешной проверки ленты
  live_url: "https://services.swpc.noaa.gov/products/alerts.json"
  archive_url: "ftp://ftp.swpc.noaa.gov/pub/alerts/alerts_{yyyymm}.html"
  replay: exact

goes_protons:
  title: "Интегральный поток протонов GOES (≥10…≥500 МэВ)"
  group: radiation
  provider: "NOAA SWPC · NCEI (архив GOES-18)"
  what: "Поток протонов от Солнца по энергиям ≥10…≥500 МэВ на геостационарной орбите, каждые 5 минут."
  used_for: "Главное измерение для частиц от Солнца: из него считается, сколько долетает до станции, и строится прогноз на 6 ч."
  interval_s: 300
  max_age_s: 1800
  live_url: "https://services.swpc.noaa.gov/json/goes/primary/integral-protons-6-hour.json"
  # после простоя — продукт SWPC, покрывающий пропуск (часы: адрес); пропуск больше недели — ещё архив NCEI
  catchup_urls:
    24: "https://services.swpc.noaa.gov/json/goes/primary/integral-protons-1-day.json"
    72: "https://services.swpc.noaa.gov/json/goes/primary/integral-protons-3-day.json"
    168: "https://services.swpc.noaa.gov/json/goes/primary/integral-protons-7-day.json"
  archive_url: "https://data.ngdc.noaa.gov/platforms/solar-space-observing-satellites/goes/goes{sat}/l2/data/sgps-l2-avg5m/{yyyy}/{mm}/sci_sgps-l2-avg5m_g{sat}_d{yyyymmdd}_v3-0-2.nc"
  archive_satellite: 18
  replay: reconstructed

kp_observed:
  title: "Планетарный индекс Kp (наблюдение)"
  group: radiation
  provider: "NOAA SWPC · GFZ Potsdam (архив)"
  what: "Индекс магнитной бури Kp по 3-часовым интервалам (измеренный)."
  used_for: "Насколько магнитное поле Земли ослаблено и пускает частицы ближе к экватору."
  interval_s: 900
  max_age_s: 14400
  live_url: "https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json"
  archive_url: "https://kp.gfz.de/app/json/?start={start}&end={end}&index=Kp"
  replay: reconstructed

kp_forecast:
  title: "Прогноз Kp SWPC (3-часовые интервалы)"
  group: radiation
  provider: "NOAA SWPC"
  what: "Прогноз индекса Kp на ближайшие сутки по 3-часовым интервалам."
  used_for: "Kp после момента расчёта — для оценки защиты станции полем Земли."
  interval_s: 1800
  max_age_s: 21600
  live_url: "https://services.swpc.noaa.gov/products/noaa-planetary-k-index-forecast.json"
  replay: exact

swpc_3day:
  title: "3-дневный прогноз SWPC (Kp, вероятность S1)"
  group: radiation
  provider: "NOAA SWPC · NCEI (архив)"
  what: "3-дневный прогноз: Kp по 3 ч и вероятность протонного события S1 по суткам."
  used_for: "Прогноз за пределами 6 ч, где поток частиц уже не предсказать по минутам."
  interval_s: 3600
  max_age_s: 46800
  issue_times_utc: ["00:30", "12:30"]
  live_url: "https://services.swpc.noaa.gov/text/3-day-forecast.txt"
  archive_url: "https://www.ngdc.noaa.gov/stp/space-weather/swpc-products/daily_reports/3day_forecast/{yyyy}/{mm}/{yyyymmdd}{hhmm}three_day_forecast.txt"
  replay: exact

swpc_rsga:
  title: "Отчёт и прогноз RSGA (вероятность протонного события)"
  group: radiation
  provider: "NOAA SWPC · NCEI (архив)"
  what: "Ежедневный отчёт RSGA: вероятность протонного события и вспышек M/X на 3 суток."
  used_for: "Суточная вероятность частиц от Солнца (закрывает пропуски 3-дневного прогноза)."
  interval_s: 3600
  max_age_s: 93600
  issue_times_utc: ["22:00"]
  live_url: "https://services.swpc.noaa.gov/text/sgarf.txt"
  archive_url: "https://www.ngdc.noaa.gov/stp/space-weather/swpc-products/daily_reports/reports_solar_geophysical_activity/{yyyy}/{mm}/{yyyymmdd}RSGA.txt"
  replay: exact

meteor_forecast:
  title: "Прогноз метеорных потоков для низкой орбиты (NASA MEO)"
  group: mmod
  provider: "NASA Meteoroid Environment Office (NTRS)"
  what: "Годовой прогноз метеорных потоков для низкой орбиты: почасовой поток и отношение к обычному фону."
  used_for: "Мелкие частицы, которых не видно поштучно: метеорные потоки в окне выхода."
  interval_s: 86400          # выпуск раз в год (осенью на следующий год) — проверка раз в сутки
  max_age_s: 34560000        # 400 сут
  replay: exact              # время выпуска — distributionDate записи NTRS
  forecasts:                 # год: номер записи NTRS
    2024: "20230015158"
    2025: "20240012381"
    2026: "20250009524"
  meta_url: "https://ntrs.nasa.gov/api/citations/{id}"
  flux_url: "https://ntrs.nasa.gov/api/citations/{id}/downloads/flux_data.txt"
  doc_url: "https://ntrs.nasa.gov/api/citations/{id}/downloads/LEO_Forecast_{year}.pdf.txt"

iss_spacetrack:
  title: "Орбитальные элементы МКС (Space-Track)"
  group: orbit
  provider: "Space-Track (18th SDS, США)"
  what: "Орбитальные элементы МКС (TLE) с датой публикации, текущие и история."
  used_for: "Где летит станция: широта, долгота, высота — для всех оценок."
  endpoint: "https://www.space-track.org/basicspacedata/query/class/gp/NORAD_CAT_ID/25544/format/json"   # только для показа в консоли; запросы строит адаптер
  interval_s: 3600
  max_age_s: 172800
  replay: exact

iss_celestrak:
  title: "Орбитальные элементы МКС (CelesTrak, резерв)"
  group: orbit
  provider: "CelesTrak"
  what: "Орбитальные элементы МКС (TLE) — резервный источник."
  used_for: "Орбита станции, если Space-Track недоступен."
  interval_s: 7200
  max_age_s: 172800
  live_url: "https://celestrak.org/NORAD/elements/gp.php?CATNR=25544&FORMAT=tle"
  replay: exact

catalog_spacetrack:
  title: "Каталог объектов на высотах МКС (Space-Track)"
  group: mmod
  provider: "Space-Track (18th SDS, США)"
  what: "Элементы всех отслеживаемых объектов, чья орбита пересекает высоты МКС (380–460 км)."
  used_for: "Поиск опасных сближений с мусором и спутниками в окне выхода."
  endpoint: "https://www.space-track.org/basicspacedata/query/class/gp/PERIAPSIS/<460/APOAPSIS/>380/DECAY_DATE/null-val/format/json"   # только для показа в консоли; запросы строит адаптер
  interval_s: 21600
  max_age_s: 86400
  replay: exact

spacetrack:
  base_url: "https://www.space-track.org"
  min_request_interval_s: 2.5
  band_min_km: 380
  band_max_km: 460
