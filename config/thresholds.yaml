# Параметры расчёта. Значения черновые, обоснование — docs/method.md.

grid_step_s: 30          # шаг расчётной сетки
output_step_s: 60        # шаг рядов в результате (для графиков)
context_before_h: 6      # сколько истории показывать до момента отсечки

window:
  step_min: 15                     # шаг перебора начала окна
  tolerance_min: 5                 # разница меньше — окна равнозначны
  default_overrun_margin_min: 60   # запас на задержку работ
  default_return_to_airlock_min: 30
  priority: [radiation, mmod]      # приоритет механизмов при компромиссе
  max_search_h: 72
  guaranteed_search_h: 24
  min_duration_h: 1
  max_duration_h: 8

radiation:
  energies_mev: [10, 30, 50, 100, 500]
  # Поток протонов выше порога обрезания в точке МКС (оценка по спектру GOES), pfu
  jiss_critical_pfu: 10
  jiss_undesirable_pfu: 1
  # Поток ≥10 МэВ на геостационаре (шкала NOAA S), pfu
  geo_s1_pfu: 10          # S1: событие идёт — нежелательно даже под защитой поля
  geo_s3_pfu: 1000        # S3: NOAA рекомендует избегать ВКД — критично независимо от положения
  saa_b_nt: 21000          # |B| на высоте МКС ниже порога — ЮАА (~8 проходов, ~75 мин в сутки)
  kp_cutoff_shift_deg_per_kp: 1.0   # сдвиг эффективной геомагнитной широты на единицу Kp
  kp_assumed_if_unknown: 5          # консервативное значение, если Kp неизвестен
  obs_max_gap_min: 15      # дальше от ближайшего измерения — «нет данных»
  forecast_horizon_h: 6    # горизонт собственного прогноза
  decay_fit_window_h: 3    # окно подгонки экспоненциального спада
  max_decay_per_h: 0.15    # ограничение скорости спада (ln/ч; e-кратное время ≥ ~7 ч — типичный спад событий)
  rising_min_rate_per_h: 0.2   # поток растёт быстрее (и за 3 ч, и за последний час) — фаза нарастания
  max_growth_factor: 10        # рост на фазе нарастания ограничен порядком величины
  exposure_rel_tolerance: 0.2  # окна с разницей оценки потока за окно < 20% — равнозначны по радиации
  prob_undesirable_pct: 50 # вероятность протонного события выше — нежелательно
  default_spectrum_gamma: 2.0   # J(>E) ~ E^-gamma, если спектр события неизвестен

mmod:
  box_radial_km: 2         # зона контроля МКС (по открытым материалам NASA, проверить)
  box_intrack_km: 25
  box_crosstrack_km: 25
  report_range_km: 50      # сближения ближе — показываются как информация
  coarse_step_s: 30
  tca_pad_min: 10          # критический интервал вокруг момента наибольшего сближения
  docked_median_km: 10     # объекты ближе в среднем — пристыкованы к МКС, исключаются
  max_element_age_days: 3
